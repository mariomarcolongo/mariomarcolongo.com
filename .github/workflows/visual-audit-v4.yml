name: Visual audit portfolio

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/capture-homepage-v4.js
      - src/pages/index.astro
      - src/pages/evidence/**
      - src/components/**
      - src/styles/studio.css
      - data/source.js
      - data/work-media.json
      - public/media/work/**
      - .github/workflows/visual-audit-v4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and retain diagnostics
        shell: bash
        run: |
          mkdir -p audit-build
          set -o pipefail
          npm run build 2>&1 | tee audit-build/build.log
      - name: Capture scrolled homepage states
        run: node scripts/capture-homepage-v4.js
      - name: Preserve Gray Swan source asset
        shell: bash
        run: |
          SOURCE_ASSET=$(node -e "console.log('public'+require('./data/source.js').presence.aiEvaluationSnapshot.originalImage)")
          cp "$SOURCE_ASSET" audit-v4/gray-swan-original.jpg
          cp audit-build/build.log audit-v4/build.log
          sha256sum audit-v4/gray-swan-original.jpg > audit-v4/gray-swan-original.sha256
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-audit
          path: audit-v4/**/*
          if-no-files-found: error
          retention-days: 7
