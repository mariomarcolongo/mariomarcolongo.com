name: Verify portfolio

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and verify generated output
        shell: bash
        run: |
          mkdir -p audit-output
          set -o pipefail
          npm run build 2>&1 | tee audit-output/build.log

      - name: Diagnose mobile layout
        run: node scripts/diagnose-mobile-overflow.js | tee audit-output/mobile-overflow.json

      - name: Regenerate and verify canonical dossiers
        run: |
          npm run generate:llms
          node scripts/verify-dist.js

      - name: Verify rendered pages and interactions
        shell: bash
        run: |
          find audit-output -type f -name '*.png' -delete
          set -o pipefail
          npm run verify:render 2>&1 | tee audit-output/render.log

      - name: Verify Notandia continuity and legacy-link safety
        run: node scripts/verify-notandia-transition.js

      - name: Generate the three current application PDFs
        run: npm run pdf

      - name: Verify current release routes and exact public assets locally
        run: |
          node scripts/verify-discovery.js
          node scripts/verify-live-release.js --local

      - name: Check patch formatting
        run: git diff --check

      - name: Upload verification screenshots, logs, full build and PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-output
          path: |
            audit-output/**/*
            dist/**/*
            llms.txt
            llms-full.txt
            cv-llm.txt
            public/llms.txt
            public/llms-full.txt
            public/cv-llm.txt
            index.html
            mdpi-filter.html
            integrity.html
            cv.html
            cv-resume.html
            cv-research.html
            cv-editorial.html
            cv-integrity.html
            security.html
            public/Mario-Marcolongo-*.pdf
          if-no-files-found: ignore
          retention-days: 7
