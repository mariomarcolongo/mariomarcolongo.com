name: Deploy to Cloudflare Pages

# Production deployment for the application-ready portfolio.
# Production runs only from main. Pull requests use Cloudflare's isolated preview.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: true
    name: Build, deploy and verify production site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Check out trusted production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application-ready portfolio
        run: npm run build

      - name: Verify rendered pages and interactions
        run: npm run verify:render

      - name: Generate current application PDFs and verify discovery metadata
        run: |
          npm run pdf
          node scripts/verify-discovery.js
          node scripts/verify-live-release.js --local

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mariomarcolongo-pages --branch=main --commit-hash=${{ env.DEPLOY_SHA }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the public release
        env:
          LIVE_RELEASE_ID: ${{ env.DEPLOY_SHA }}
          LIVE_VERIFY_ATTEMPTS: '18'
          LIVE_VERIFY_DELAY_MS: '10000'
        run: npm run verify:live
