name: Verify Cloudflare production

# Cloudflare's Git integration owns production and preview deployment.
# Check the public release against the same committed assets that it publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: cloudflare-pages-production-verification
      cancel-in-progress: true
    name: Verify native Pages production release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://mariomarcolongo.com
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Check out trusted production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application-ready portfolio
        run: npm run build

      - name: Verify rendered pages and interactions
        run: npm run verify:render

      # The PR verification workflow regenerates and checks all three PDFs.
      # Native Pages publishes committed public PDFs; do not replace those here
      # before comparing their exact bytes with the live release.
      - name: Verify committed release assets and discovery metadata
        run: |
          node scripts/verify-discovery.js
          node scripts/verify-live-release.js --local

      - name: Verify the public release
        env:
          LIVE_RELEASE_ID: ${{ env.DEPLOY_SHA }}
          LIVE_VERIFY_ATTEMPTS: '18'
          LIVE_VERIFY_DELAY_MS: '10000'
        run: npm run verify:live
